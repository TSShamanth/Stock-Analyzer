name: Daily Stock Scan

on:
  schedule:
    # Runs at 10:45 AM UTC (4:15 PM IST) every weekday
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3.0.0" yfinance requests

      - name: Run Stock Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "stock_analyzer/scanner.py" ]; then
            python stock_analyzer/scanner.py
          elif [ -f "scanner.py" ]; then
            python scanner.py
          else
            echo "❌ Error: scanner.py not found in stock_analyzer/ or root!"
            ls -R
            exit 1
          fi
